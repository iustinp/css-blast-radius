<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSS Blast Radius — Setup</title>
<style>
  :root {
    --bg: #f6f8fa; --panel: #fff; --line: #d0d7de; --line-soft: #eaeef2; --text: #1f2328; --muted: #656d76;
    --accent: #0969da; --accent-soft: #ddf4ff; --ok: #1a7f37; --ok-soft: #dafbe1; --warn: #9a6700; --warn-soft: #fff8c5;
    --bad: #cf222e; --bad-soft: #ffebe9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); background: var(--bg); }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
  a { color: var(--accent); text-decoration: none; cursor: pointer; }
  a:hover { text-decoration: underline; }
  .hidden { display: none !important; }
  .muted { color: var(--muted); }
  .small { font-size: 12.5px; }

  header.top { background: #1f2328; color: #e6edf3; display: flex; align-items: center; gap: 14px; padding: 0 24px; height: 52px; }
  .brand { font-weight: 700; display: flex; gap: 10px; align-items: center; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff7b72; box-shadow: 0 0 0 4px #ff7b7233, 0 0 0 8px #ff7b7218; }
  header.top .live { color: #3fb950; font-size: 13px; display: flex; align-items: center; gap: 6px; }
  header.top .sp { flex: 1; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 24px 80px; }

  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 12px; color: var(--text); white-space: nowrap; }
  .btn:hover { background: #f3f4f6; }
  .btn.primary { background: #1f883d; border-color: #1a7f37; color: #fff; font-weight: 600; }
  .btn.primary:hover { background: #1a7f37; }
  .btn.danger { color: var(--bad); }
  .btn.small { padding: 2px 8px; font-size: 12.5px; }
  .btn.link { border: 0; background: none; color: var(--accent); padding: 0; }
  .btn:disabled { opacity: .55; cursor: default; }
  input[type=text], input[type=url], textarea, select { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: #fff; }

  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  .card + .card { margin-top: 16px; }
  .card-h { padding: 12px 16px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .card-h h2 { font-size: 15px; margin: 0; }
  .card-b { padding: 16px; }
  .sp { flex: 1; }

  .site { display: flex; gap: 22px; align-items: center; flex-wrap: wrap; padding: 12px 16px; }
  .site .k { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .03em; display: block; }
  .form { display: grid; grid-template-columns: 190px 1fr; gap: 14px 20px; align-items: start; padding: 16px; border-top: 1px solid var(--line-soft); }
  .form .lab { font-weight: 600; padding-top: 5px; }
  .form .hint { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); border-radius: 14px; padding: 2px 10px; background: #fff; cursor: pointer; user-select: none; }
  .chip.on { background: var(--accent-soft); border-color: #54aeff; color: var(--accent); }

  .watch-row { display: flex; gap: 12px; align-items: baseline; padding: 10px 16px; border-top: 1px solid var(--line-soft); flex-wrap: wrap; }
  .watch-row:first-of-type { border-top: 0; }
  .watch-row .k { width: 92px; flex: none; font-weight: 600; }
  .watch-row .v { flex: 1; min-width: 260px; }
  .watch-row .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .watch-row input[type=text] { width: 380px; max-width: 100%; }

  .sheets-sec { border-top: 1px solid var(--line-soft); padding: 12px 16px; }
  .sheets-summary { cursor: pointer; display: flex; align-items: center; gap: 8px; font-weight: 600; user-select: none; }
  .sheets-summary::-webkit-details-marker { color: var(--muted); }
  .sheets-list { margin-top: 10px; border-top: 1px solid var(--line-soft); }

  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 9px 12px; border-top: 1px solid var(--line-soft); vertical-align: middle; }
  th { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; border-top: 0; background: #fafbfc; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.actions { white-space: nowrap; text-align: right; }
  tr.paused td { color: var(--muted); }
  .gname { font-weight: 600; }
  .pill { display: inline-block; padding: 0 8px; border-radius: 10px; font-size: 12px; background: var(--line-soft); color: var(--muted); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .pill.blue { background: var(--accent-soft); color: var(--accent); }
  .totals { display: flex; gap: 24px; padding: 10px 16px; border-top: 1px solid var(--line-soft); color: var(--muted); font-size: 13px; flex-wrap: wrap; }

  .switch { position: relative; width: 36px; height: 20px; display: inline-block; vertical-align: middle; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: #afb8c1; border-radius: 20px; transition: .2s; cursor: pointer; }
  .switch span::before { content: ""; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + span { background: #1f883d; }
  .switch input:checked + span::before { transform: translateX(16px); }
  .progress { height: 6px; background: var(--line-soft); border-radius: 3px; overflow: hidden; width: 110px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .2s; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .back { display: inline-block; margin-bottom: 12px; }
  .ghead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
  .ghead h1 { font-size: 22px; margin: 0; }
  .filters { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .fbtn { border: 1px solid var(--line); background: #fff; border-radius: 14px; padding: 1px 10px; font-size: 13px; }
  .fbtn.on { background: var(--accent-soft); border-color: #54aeff; color: var(--accent); }
  .reason { color: var(--bad); font-size: 12px; }
  .url { word-break: break-all; }

  .backdrop { position: fixed; inset: 0; background: #1f232866; display: none; align-items: flex-start; justify-content: center; padding-top: 8vh; z-index: 30; }
  .backdrop.open { display: flex; }
  .modal { width: min(620px, 94vw); background: #fff; border-radius: 10px; box-shadow: 0 12px 40px #1f232840; overflow: hidden; }
  .modal .mh { padding: 14px 18px; border-bottom: 1px solid var(--line); font-weight: 600; display: flex; justify-content: space-between; }
  .modal .mb { padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; }
  .modal .mf { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
  .tabs button { border: 0; background: none; padding: 8px 12px; border-bottom: 2px solid transparent; color: var(--muted); }
  .tabs button.on { border-color: #fd8c73; color: var(--text); font-weight: 600; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 13px; }
  label.f .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  .drop { border: 2px dashed var(--line); border-radius: 8px; padding: 22px; text-align: center; color: var(--muted); }
  .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .preview { background: var(--bg); border: 1px solid var(--line-soft); border-radius: 6px; padding: 10px 12px; font-size: 13px; }
  .preview ul { margin: 6px 0 0; padding-left: 18px; color: var(--muted); }
  .modal-err { color: var(--bad); background: var(--bad-soft); padding: 8px 12px; border-radius: 6px; font-size: 13px; }

  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(120px); background: #1f2328; color: #fff; padding: 10px 16px; border-radius: 8px; max-width: 600px; transition: transform .25s; z-index: 40; display: flex; gap: 12px; align-items: center; }
  .toast.show { transform: translateX(-50%); }
  .toast.err { background: #cf222e; }
  .toast .btn { background: #ffffff1a; color: #fff; border-color: #ffffff33; }
  .toast .btn:hover { background: #ffffff2d; }
</style>
</head>
<body>
<header class="top">
  <span class="brand"><span class="dot"></span>CSS Blast Radius</span>
  <span class="live" id="serverStat">● Running on this computer · localhost:4317</span>
  <span class="sp"></span>
</header>
<main id="view">
  <div style="padding:40px;text-align:center"><span class="spinner"></span> Loading…</div>
</main>

<div class="backdrop" id="modal">
  <div class="modal">
    <div class="mh"><span id="mTitle">Add a page group</span><button class="btn link" data-close>✕</button></div>
    <div class="mb">
      <div class="modal-err hidden" id="modalErr"></div>
      <label class="f" id="gNameWrap">Group name<input type="text" id="gName" placeholder="e.g. Blog"></label>
      <div class="tabs" id="srcTabs">
        <button data-src="sitemap" class="on">Sitemap</button>
        <button data-src="csv">CSV file</button>
        <button data-src="paste">Paste URLs</button>
      </div>
      <div data-pane="sitemap">
        <label class="f">Sitemap URL<input type="url" id="smUrl" value=""></label>
        <label class="f" style="margin-top:10px">Only pages matching <span class="hint">Optional. Use * as a wildcard, e.g. /stories/*</span><input type="text" id="smFilter" placeholder="/stories/*"></label>
        <div style="margin-top:10px"><button class="btn" id="smPreview">Read sitemap</button></div>
        <p class="muted small" style="margin:8px 0 0">The sitemap is read again on every rescan: new pages join the group, removed pages leave it.</p>
      </div>
      <div data-pane="csv" class="hidden">
        <div class="drop" id="drop">Drop a .csv file here or <label class="btn link" style="cursor:pointer">choose one<input type="file" id="csvFile" accept=".csv,text/csv" hidden></label>
          <div class="small" style="margin-top:6px">Any CSV with a column of URLs or paths.</div>
        </div>
      </div>
      <div data-pane="paste" class="hidden">
        <label class="f">URLs or paths, one per line<textarea id="pasteBox" rows="6" placeholder="https://www.example.com/pricing&#10;/about&#10;/contact"></textarea></label>
      </div>
      <div class="preview hidden" id="srcPreview"></div>
    </div>
    <div class="mf">
      <label class="small muted" style="margin-right:auto"><input type="checkbox" id="captureNow" checked> Scan now</label>
      <button class="btn" data-close>Cancel</button>
      <button class="btn primary" id="mOk" disabled>Add group</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><span id="toastText"></span><span id="toastAct"></span></div>

<script>
// ---------------------------------------------------------------- helpers
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmt = (n) => (n || 0).toLocaleString("en-US");
const plural = (n, w) => `${fmt(n)} ${w}${n === 1 ? "" : "s"}`;
const isUrl = (v) => /^(https?:\/\/|\/)/i.test((v || "").trim());
// A bare path such as "about.html" or "blog/post-1" (no spaces, no scheme).
const isBarePath = (v) => /^[\w%~.-]+(\/\S*)?$/.test((v || "").trim()) && !/^[a-z][a-z0-9+.-]*:/i.test((v || "").trim());

// Same-site addresses become paths; other sites' addresses are sent as is (the server skips them).
function toPagePath(v, origin) {
  v = v.trim();
  if (/^https?:\/\//i.test(v)) {
    try {
      const u = new URL(v);
      const host = (h) => h.replace(/^www\./, "");
      if (!origin || host(u.hostname) === host(new URL(origin).hostname)) return (u.pathname || "/") + u.search;
    } catch {}
    return v;
  }
  return v.startsWith("/") ? v : "/" + v;
}

function formatBytes(bytes) {
  if (!bytes || bytes <= 0) return "0 MB";
  const mb = bytes / (1024 * 1024);
  if (mb < 1000) return Math.round(mb) + " MB";
  return (mb / 1024).toFixed(1) + " GB";
}

function timeAgo(iso) {
  if (!iso) return "never";
  const ms = Date.now() - new Date(iso).getTime();
  if (isNaN(ms)) return esc(iso);
  const s = Math.round(ms / 1000);
  if (s < 45) return "just now";
  const m = Math.round(s / 60);
  if (m < 60) return `${m} minute${m === 1 ? "" : "s"} ago`;
  const h = Math.round(m / 60);
  if (h < 24) return `${h} hour${h === 1 ? "" : "s"} ago`;
  const d = Math.round(h / 24);
  if (d === 1) return "yesterday";
  if (d < 30) return `${d} days ago`;
  return new Date(iso).toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

// ---------------------------------------------------------------- state
let state = null;
const lastResultIds = {}; // site id -> last result shown
let currentGroupPages = null;
let pageFetchTimer = null;

const S = {
  site: null,          // null = all sites, "new" = add a site, or a site id
  view: "list",        // "list" or groupId
  status: "all",       // "all" | "ok" | "failed" | "new" | "excluded"
  search: "",
  limit: 50,
  siteEditing: false,
  watchRepoEditing: false,
  watchRepoDraft: undefined,
  src: "sitemap",
  pending: null,
  modalMode: "group"   // "group" or "pages"
};

const siteById = (id) => (state?.sites || []).find((x) => x.id === id);
// The site being shown (never undefined while one is open, so `cur().groups` etc. are safe).
const cur = () => siteById(S.site) || { site: null, groups: [], stylesheets: [], totals: null, watch: null };
const G = (id) => cur().groups?.find((g) => g.id === id);
// API path scoped to a site (the open one by default).
const sp = (path, sid = S.site) => `/api/sites/${encodeURIComponent(sid)}${path}`;

// ---------------------------------------------------------------- navigation (#site=<id>&group=<id>, #new)
function readHash() {
  const h = new URLSearchParams(location.hash.replace(/^#/, ""));
  return { site: h.has("new") ? "new" : h.get("site") || null, group: h.get("group") || "list" };
}

function go(site, group = "list") {
  let h = "";
  if (site === "new") h = "#new";
  else if (site) h = "#" + new URLSearchParams(group !== "list" ? { site, group } : { site }).toString();
  if (h === location.hash || (!h && !location.hash)) return route();
  if (h) return void (location.hash = h); // routed by "hashchange"
  history.pushState(null, "", location.pathname + location.search);
  route();
}

function route() {
  const { site, group } = readHash();
  if (site !== S.site) {
    S.siteEditing = false;
    S.watchRepoEditing = false;
    S.watchRepoDraft = undefined;
  }
  S.site = site;
  S.view = group;
  S.status = "all";
  S.search = "";
  S.limit = 50;
  currentGroupPages = null;
  closeModal();
  if (state) $("#view").innerHTML = ""; // a fresh screen: don't carry typed values over (see keepFields)
  render();
  window.scrollTo(0, 0);
  if (S.view !== "list" && siteById(S.site)) fetchPages(S.view);
}
window.addEventListener("hashchange", route);

// ---------------------------------------------------------------- API calls
async function api(path, options = {}) {
  const opts = { ...options, headers: { "Content-Type": "application/json", ...(options.headers || {}) } };
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || `Request failed (${res.status})`);
    err.data = data;
    throw err;
  }
  return data;
}

async function loadState() {
  try {
    const s = await api("/api/state");
    applyState(s);
  } catch (err) {
    $("#view").innerHTML = `<div class="card"><div class="card-b"><p class="reason">Failed to connect to server: ${esc(err.message)}</p><button class="btn" onclick="loadState()">Retry</button></div></div>`;
  }
}

function applyState(newState) {
  const oldVer = state ? state.version : null;
  const first = !state;
  state = newState;
  if (state.server?.url) {
    $("#serverStat").textContent = `● Running on this computer · ${state.server.url.replace(/^https?:\/\//, "")}`;
  }
  for (const site of state.sites || []) {
    const r = site.lastResult;
    const prev = lastResultIds[site.id];
    lastResultIds[site.id] = r ? r.id : null;
    if (!r || r.id === prev) continue;
    // On first load only the open site's last result is shown; later, every new one is.
    if (first && site.id !== S.site) continue;
    toast(site.id === S.site ? r.message : `<b>${esc(site.name)}</b>: ${r.message}`, null, null, !r.ok);
  }
  if (S.view !== "list") {
    if (oldVer !== state.version) {
      debounceFetchPages(G(S.view));
    }
  }
  render();
}

function connectEvents() {
  const es = new EventSource("/api/events");
  es.addEventListener("state", (e) => {
    try {
      const s = JSON.parse(e.data);
      applyState(s);
    } catch {}
  });
}

function debounceFetchPages(g) {
  clearTimeout(pageFetchTimer);
  pageFetchTimer = setTimeout(() => {
    if (g && S.view === g.id) fetchPages(g.id);
  }, 300);
}

async function fetchPages(groupId) {
  if (!groupId || !siteById(S.site)) return;
  const sid = S.site;
  try {
    const q = encodeURIComponent(S.search);
    const data = await api(sp(`/groups/${groupId}/pages?status=${S.status}&q=${q}&offset=0&limit=${S.limit}`, sid));
    if (S.site !== sid || S.view !== groupId) return;
    currentGroupPages = data;
    renderGroup(G(groupId));
  } catch (err) {
    // Keep existing group pages on transient error
  }
}

// ---------------------------------------------------------------- rendering
// Re-render without losing what's being typed in these fields (state updates arrive while scanning).
const KEEP_FIELDS = ["welcomeAddr", "welcomeDevs", "siteAddrInput", "siteDevChips"];
function keepFields(renderFn) {
  const saved = KEEP_FIELDS.map((id) => {
    const el = document.getElementById(id);
    if (!el) return null;
    if (el.classList.contains("chips")) return { id, on: [...el.querySelectorAll(".chip.on")].map((c) => c.dataset.dev) };
    return { id, value: el.value, pos: document.activeElement === el ? el.selectionStart : null };
  });
  renderFn();
  for (const s of saved) {
    const el = s && document.getElementById(s.id);
    if (!el) continue;
    if (s.on) {
      el.querySelectorAll(".chip").forEach((c) => c.classList.toggle("on", s.on.includes(c.dataset.dev)));
    } else {
      el.value = s.value;
      if (s.pos !== null) { el.focus(); el.setSelectionRange(s.pos, s.pos); }
    }
  }
}

function render() {
  if (!state) return;
  keepFields(() => {
    const sites = state.sites || [];
    if (S.site === "new" || !sites.length) return renderAddSite();
    if (!S.site) return renderSites();
    if (!siteById(S.site)) {
      // The site was deleted, or the address in the URL is out of date.
      history.replaceState(null, "", location.pathname + location.search);
      S.site = null;
      S.view = "list";
      return renderSites();
    }
    if (S.view === "list") renderList();
    else renderGroup(G(S.view));
  });
}

const ALL_DEVS = [
  { id: "desktop", label: "Desktop 1366×768" },
  { id: "mobile", label: "Mobile 390×844" },
  { id: "tablet", label: "Tablet 820×1180" }
];
const devChips = (id, on) => `<div class="chips" id="${id}">
    ${ALL_DEVS.map((d) => `<span class="chip${on.includes(d.id) ? " on" : ""}" data-dev="${d.id}">${esc(d.label)}</span>`).join("")}
  </div>`;

function renderAddSite() {
  const first = !(state.sites || []).length;
  const had = !!$("#welcomeAddr");
  $("#view").innerHTML = `
    ${first ? "" : `<a class="back" data-nav="sites">← All sites</a>`}
    <div class="card">
      <div class="card-h"><h2>${first ? "Welcome to CSS Blast Radius" : "Add a site"}</h2></div>
      <div class="card-b">
        <p>${first ? "Tell us where your website is running to get started. You can use" : "Use"} a live site address or a built folder on this computer.</p>
        <div style="display:flex;flex-direction:column;gap:14px;max-width:540px;margin-top:16px">
          <label class="f">Site address
            <input type="text" id="welcomeAddr" placeholder="https://www.example.com or /Users/me/site/dist">
            <span class="hint">Enter an http(s) URL, or an absolute folder path on this computer.</span>
          </label>
          <label class="f">Devices to scan
            ${devChips("welcomeDevs", ["desktop", "mobile"])}
            <span class="hint">At least one device required.</span>
          </label>
          <div style="margin-top:6px">
            <button class="btn primary" id="welcomeSave">${first ? "Save and continue" : "Add site"}</button>
            ${first ? "" : `<button class="btn" data-nav="sites">Cancel</button>`}
          </div>
        </div>
      </div>
    </div>
    ${first ? `<div class="card" style="opacity:0.65">
      <div class="card-h"><h2>Page groups</h2></div>
      <div class="card-b"><p class="muted">Add your site address above to start adding page groups.</p></div>
    </div>` : ""}`;
  if (!had) $("#welcomeAddr").focus();
}

function jobCell(j) {
  if (j.phase === "sitemap") return `<span class="spinner"></span><span class="small">Reading sitemap…</span>`;
  const pct = Math.round((100 * (j.done || 0)) / Math.max(1, j.total || 1));
  return `<span class="progress"><i style="width:${pct}%"></i></span><span class="small">Scanning ${fmt(j.done)} / ${fmt(j.total)}</span>`;
}

function siteScanCell(site) {
  if (site.job) return jobCell(site.job);
  const groups = site.groups || [];
  if (!groups.length) return `<span class="small muted">No groups yet</span>`;
  const last = groups.map((g) => g.scannedAt).filter(Boolean).sort().pop();
  if (!last) return `<span class="pill warn">Never scanned</span>`;
  const failed = groups.reduce((n, g) => n + (g.active ? g.failed || 0 : 0), 0);
  return `<span class="small">Scanned ${timeAgo(last)}</span>` + (failed ? ` <span class="pill bad">${fmt(failed)} failed</span>` : "");
}

function siteWatchCell(site) {
  const w = site.watch;
  if (!w || !w.enabled) return watchPill("off");
  const states = [w.code?.state, w.content?.state];
  const st = ["updating", "waiting", "error", "no-repo", "up-to-date"].find((x) => states.includes(x));
  return st ? watchPill(st) : `<span class="pill ok">On</span>`;
}

function projectsHtml() {
  const projects = state.projects || [];
  if (!projects.length) {
    return `<div class="small muted" style="margin-top:14px">No VS Code project connected yet. Open a project in VS Code with the CSS Blast Radius extension, then link it to groups from the status bar.</div>`;
  }
  const findGroup = (gid) => {
    for (const site of state.sites || []) {
      const g = (site.groups || []).find((x) => x.id === gid);
      if (g) return { site, g };
    }
    return null;
  };
  const pItems = projects.map((p) => {
    const linked = (p.groups || []).map((gid) => {
      const f = findGroup(gid);
      return f ? `<a data-site="${esc(f.site.id)}" data-group="${esc(f.g.id)}">${esc(f.g.name)}</a> on ${esc(f.site.name)}` : esc(gid);
    });
    return `<b>${esc(p.name)}</b> (${linked.length ? `linked to ${linked.join(", ")}` : "no groups linked"})`;
  }).join(" · ");
  return `<div class="small muted" style="margin-top:14px">Projects connected: ${pItems}</div>`;
}

function renderSites() {
  const sites = state.sites || [];
  const rows = sites.map((site) => {
    const addr = site.site?.siteUrl || site.site?.siteFolder || "Not configured";
    const groups = site.groups || [];
    const paused = site.totals?.pausedGroups || 0;
    return `<tr>
      <td><a class="gname" data-site="${esc(site.id)}">${esc(site.name)}</a> <span class="small muted mono url">${esc(addr)}</span></td>
      <td class="num">${fmt(site.totals?.pages)}</td>
      <td class="num">${fmt(groups.length)}${paused ? ` <span class="small muted">(${fmt(paused)} paused)</span>` : ""}</td>
      <td>${siteScanCell(site)}</td>
      <td>${siteWatchCell(site)}</td>
      <td class="actions"><button class="btn small" data-site="${esc(site.id)}">Open</button></td>
    </tr>`;
  }).join("");
  $("#view").innerHTML = `
    <div class="card">
      <div class="card-h">
        <h2>Sites</h2>
        <span class="muted small">Each site has its own page groups and scan.</span>
        <span class="sp"></span>
        <button class="btn primary" data-nav="new">+ Add a site</button>
      </div>
      <table>
        <thead><tr><th>Site</th><th class="num">Pages</th><th class="num">Groups</th><th>Scan</th><th>Auto-rescan</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="totals">
        <span>${plural(sites.length, "site")} · ${formatBytes(state.server?.diskBytes)} on this computer</span>
      </div>
    </div>
    ${projectsHtml()}`;
}

function sourceText(g) {
  if (!g || !g.source) return "";
  if (g.source.type === "sitemap") {
    let u = g.source.url;
    const siteUrl = cur().site?.siteUrl;
    if (siteUrl && u.startsWith(siteUrl)) {
      u = u.slice(siteUrl.length) || "/";
    }
    return `Sitemap <span class="mono">${esc(u)}</span>${g.source.filter ? ` · only <span class="mono">${esc(g.source.filter)}</span>` : ""}`;
  }
  if (g.source.type === "csv") return `CSV <span class="mono">${esc(g.source.file)}</span>`;
  return "Pasted list";
}

function statusCell(g) {
  if (g.job) {
    if (g.job.phase === "sitemap") {
      return `<span class="spinner"></span><span class="small">Reading sitemap…</span>`;
    }
    if (g.job.phase === "queued") {
      return `<span class="small muted">Waiting…</span>`;
    }
    const pct = Math.round((100 * (g.job.done || 0)) / Math.max(1, g.job.total || 1));
    return `<span class="progress"><i style="width:${pct}%"></i></span><span class="small">Scanning ${fmt(g.job.done)} / ${fmt(g.job.total)}</span>`;
  }
  if (!g.active) {
    return `<span class="pill">Paused</span> <span class="small muted">copy from ${timeAgo(g.scannedAt)} kept</span>`;
  }
  if (!g.scannedAt) {
    return `<span class="pill warn">Never scanned</span>`;
  }
  return `<span class="small">Scanned ${timeAgo(g.scannedAt)}</span>` +
    (g.failed ? ` <span class="pill bad">${fmt(g.failed)} failed</span>` : "") +
    (g.fresh ? ` <span class="pill warn">${fmt(g.fresh)} new</span>` : "");
}

function siteCard() {
  const site = cur();
  const s = site.site || { siteUrl: "", siteFolder: "", devices: ["desktop"] };
  const editing = S.siteEditing || !site.configured;
  const addr = s.siteUrl || s.siteFolder || "Not configured";
  const devs = (s.devices || []).map((d) => d.charAt(0).toUpperCase() + d.slice(1)).join(", ");

  const sheets = site.stylesheets || [];
  const matched = sheets.filter((sh) => sh.matches && sh.matches.length > 0).length;

  const summary = `<div class="site">
    <div><span class="k">Site address</span><span class="mono">${esc(addr)}</span></div>
    <div><span class="k">Devices</span>${esc(devs)}</div>
    <span class="sp"></span>
    ${editing ? "" : `<button class="btn small" id="editSite">Edit</button>`}
  </div>`;

  const sheetsSection = `
    <div class="sheets-sec">
      <details class="sheets-detail">
        <summary class="sheets-summary">
          <span>Stylesheets on the site</span>
          <span class="muted small">(${fmt(sheets.length)} stylesheets · ${fmt(matched)} matched to your project files)</span>
        </summary>
        <div class="small muted" style="margin:8px 0 10px">Your CSS files are matched to these by file name.</div>
        ${sheets.length ? `
          <table class="sheets-list">
            <thead><tr><th>Stylesheet</th><th class="num">Pages</th><th>Matched project file</th></tr></thead>
            <tbody>
              ${sheets.map((sh) => {
                let matchHtml = "";
                if (!sh.sameSite) {
                  matchHtml = `<span class="muted small">other site (fonts, widgets) — ignored</span>`;
                } else if (sh.matches && sh.matches.length > 0) {
                  matchHtml = sh.matches.map((m) => `<span class="pill ok mono">${esc(m.project)}/${esc(m.file)}</span>`).join(" ");
                } else {
                  matchHtml = `<span class="muted small">not matched</span>`;
                }
                return `<tr>
                  <td class="mono url">${esc(sh.url)}</td>
                  <td class="num">${fmt(sh.pages)}</td>
                  <td>${matchHtml}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>` : `<p class="muted small" style="margin:6px 0">No stylesheets detected yet.</p>`}
      </details>
    </div>`;

  if (!editing) {
    return `<div class="card">${summary}${sheetsSection}</div>`;
  }

  return `<div class="card">${summary}
    <div class="form">
      <div class="lab">Site address</div>
      <div>
        <input type="text" id="siteAddrInput" value="${esc(addr)}" style="width:420px;max-width:100%">
        <div class="hint">Pages are captured from here. Use an http(s) URL, or an absolute folder path on this computer.</div>
      </div>
      <div class="lab">Devices</div>
      ${devChips("siteDevChips", s.devices || [])}
      <div></div>
      <div>
        <button class="btn primary" id="saveSite">Save</button>
        ${site.configured ? `<button class="btn" id="cancelSite">Cancel</button>` : ""}
        <span class="muted small" style="margin-left:8px">Changing the address or devices means a rescan of active groups.</span>
      </div>
    </div>
    ${sheetsSection}
  </div>`;
}

const WATCH_PILLS = {
  "up-to-date": ["ok", "Up to date"],
  waiting: ["blue", "Waiting for the site"],
  updating: ["blue", "Updating"],
  "no-repo": ["warn", "Repository not found"],
  unavailable: ["", "Not available"],
  error: ["bad", "Problem"],
  off: ["", "Off"],
};
const watchPill = (st) => {
  const [cls, label] = WATCH_PILLS[st] || ["", st];
  return `<span class="pill ${cls}">${st === "updating" || st === "waiting" ? `<span class="spinner" style="width:9px;height:9px;margin-right:4px"></span>` : ""}${esc(label)}</span>`;
};
const shortSha = (sha) => (sha ? `<span class="mono">${esc(sha.slice(0, 7))}</span>` : "");

function watchCard() {
  const w = cur().watch;
  if (!w) return "";
  const intervals = [[30, "30 seconds"], [60, "minute"], [120, "2 minutes"], [300, "5 minutes"], [900, "15 minutes"]];
  if (!intervals.some(([s]) => s === w.intervalSec)) intervals.push([w.intervalSec, `${w.intervalSec} seconds`]);
  const head = `<div class="card-h">
      <label class="switch" title="${w.enabled ? "Stop following the site" : "Follow the site"}"><input type="checkbox" id="watchToggle" ${w.enabled ? "checked" : ""}><span></span></label>
      <h2>Keep the scan up to date</h2>
      <span class="muted small">Follows the site's code (its git branch) and page edits, and rescans only the pages a change reaches.</span>
      <span class="sp"></span>
      ${w.enabled ? `<span class="small muted">Check every <select id="watchInterval">${intervals.map(([s, l]) => `<option value="${s}" ${s === w.intervalSec ? "selected" : ""}>${esc(l)}</option>`).join("")}</select></span>
      <button class="btn small" id="watchCheck" ${w.checking ? "disabled" : ""}>${w.checking ? "Checking…" : "Check now"}</button>` : ""}
    </div>`;
  if (!w.enabled) {
    return `<div class="card">${head}<div class="watch-row"><span class="muted small">Off: the scan stays as it was when last scanned, even when the site changes.</span></div></div>`;
  }
  const c = w.code || { state: "off" };
  const repoName = c.repo ? c.repo.split("/").filter(Boolean).pop() : "";
  let codeSub = "";
  if (c.branch && c.mainCommit) {
    const behind = c.behind > 0 ? ` · the scan is ${c.approx ? "about " : ""}${plural(c.behind, "commit")} behind${c.approx ? " (judged by the scan's date)" : ""}` : "";
    codeSub = `<span class="mono">${esc(repoName)}</span> · <span class="mono">${esc(c.branch)}</span> at ${shortSha(c.mainCommit)}${c.state !== "up-to-date" && c.scanCommit ? `, scan at ${shortSha(c.scanCommit)}` : ""}${behind}`;
  }
  const editing = S.watchRepoEditing || c.state === "no-repo";
  const repoForm = editing
    ? `<div style="margin-top:6px"><input type="text" id="watchRepoInput" placeholder="/Users/me/github/my-site" value="${esc(S.watchRepoDraft ?? (cur().site?.watch?.repo || ""))}">
        <button class="btn small primary" id="watchRepoSave">Use this folder</button>
        ${S.watchRepoEditing ? `<button class="btn small" id="watchRepoCancel">Cancel</button>` : ""}</div>`
    : c.repo ? ` <button class="btn link small" id="watchRepoEdit">Change folder</button>` : "";
  const code = `<div class="watch-row">
      <span class="k">Code</span>${watchPill(c.state)}
      <div class="v">${esc(c.message || (c.state === "up-to-date" ? "The scan matches the branch the site is deployed from." : ""))}
        ${codeSub || repoForm ? `<div class="sub">${codeSub}${repoForm}</div>` : ""}
      </div>
    </div>`;
  const ct = w.content || { state: "off" };
  const content = `<div class="watch-row">
      <span class="k">Page edits</span>${watchPill(ct.state)}
      <div class="v">${esc(ct.message || "")}</div>
    </div>
    <div class="watch-row">
      <span class="k">New pages</span><label class="switch" title="${w.newPages ? "Stop adding new pages" : "Add new pages"}"><input type="checkbox" id="watchNewPages" ${w.newPages ? "checked" : ""}><span></span></label>
      <div class="v small muted">${w.newPages ? "A page that appears in /query-index.json joins the sitemap group with the most pages in its folder, and is scanned." : "Off: new pages join a sitemap group only when you rescan it."}</div>
    </div>`;
  const checked = w.checkedAt ? `<div class="watch-row"><span class="small muted">Last checked ${timeAgo(w.checkedAt)}. Only runs while this server runs; changes made meanwhile are caught up on the next check.</span></div>` : "";
  return `<div class="card">${head}${code}${content}${checked}</div>`;
}

function renderList() {
  const site = cur();
  const groups = site.groups || [];
  const totals = site.totals || { pages: 0, activeGroups: 0, pausedGroups: 0, pausedPages: 0, diskBytes: 0 };

  const rows = groups.map((g) => {
    return `<tr class="${g.active ? "" : "paused"}">
      <td><label class="switch" title="${g.active ? "Pause" : "Activate"}"><input type="checkbox" data-toggle="${g.id}" ${g.active ? "checked" : ""}><span></span></label></td>
      <td>
        <a class="gname" data-open="${g.id}">${esc(g.name)}</a>
        ${g.sharedPages ? `<div class="small muted">${fmt(g.sharedPages)} also in other groups</div>` : ""}
      </td>
      <td class="small">${sourceText(g)}</td>
      <td class="num">${fmt(g.pages)}</td>
      <td>${statusCell(g)}</td>
      <td class="actions">
        <button class="btn small" data-rescan="${g.id}" ${g.job ? "disabled" : ""}>Rescan</button>
        <button class="btn small danger" data-del="${g.id}">Delete</button>
      </td>
    </tr>`;
  }).join("");

  const repoInput = $("#watchRepoInput");
  const repoFocus = repoInput && document.activeElement === repoInput ? repoInput.selectionStart : null;
  if (repoInput) S.watchRepoDraft = repoInput.value;
  $("#view").innerHTML = `
    <a class="back" data-nav="sites">← All sites</a>
    <div class="ghead">
      <h1>${esc(site.name)}</h1>
      <span class="sp"></span>
      <button class="btn danger" id="delSite">Delete site</button>
    </div>` + siteCard() + watchCard() + `
    <div class="card">
      <div class="card-h">
        <h2>Page groups</h2>
        <span class="muted small">Paused groups aren't rescanned or counted. A page in several groups is captured once.</span>
        <span class="sp"></span>
        <button class="btn primary" id="openAdd">+ Add group</button>
      </div>
      ${groups.length ? `
        <table class="groups-table" id="groupsTable">
          <thead>
            <tr><th style="width:60px">Active</th><th>Name</th><th>Source</th><th class="num">Pages</th><th>Status</th><th></th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>` : `<p class="muted" style="padding:24px 16px;margin:0">No page groups added yet. Click "+ Add group" to start scanning your site.</p>`}
      <div class="totals">
        <span><b>${fmt(totals.pages)}</b> pages watched in ${plural(totals.activeGroups, "active group")} · ${formatBytes(totals.diskBytes)} on this computer</span>
        ${totals.pausedGroups ? `<span>Paused: ${plural(totals.pausedPages, "page")} in ${plural(totals.pausedGroups, "group")}</span>` : ""}
      </div>
    </div>
    ${projectsHtml()}`;
  const again = $("#watchRepoInput");
  if (again && repoFocus !== null) {
    again.focus();
    again.setSelectionRange(repoFocus, repoFocus);
  }
}

function renderGroup(g) {
  if (!g) {
    // The group was deleted, or the address in the URL is out of date.
    S.view = "list";
    history.replaceState(null, "", "#" + new URLSearchParams({ site: S.site }).toString());
    return renderList();
  }

  const sitemap = g.source && g.source.type === "sitemap";
  const data = currentGroupPages || { counts: { all: g.pages, ok: g.ok, failed: g.failed, new: g.fresh, excluded: g.excluded }, total: 0, pages: [] };
  const c = data.counts || { all: g.pages, ok: g.ok, failed: g.failed, new: g.fresh, excluded: g.excluded };

  const stPill = (p) => {
    if (p.status === "excluded") return `<span class="pill">Excluded</span>`;
    if (p.status === "ok") return `<span class="pill ok">OK</span>`;
    if (p.status === "capturing") return `<span class="spinner"></span><span class="small">Scanning…</span>`;
    if (p.status === "new") return `<span class="pill warn">Not scanned yet</span>`;
    return `<span class="pill bad">Failed</span> ${p.reason ? `<span class="reason">${esc(p.reason)}</span>` : ""}`;
  };

  const rows = (data.pages || []).map((p) => {
    const isEx = p.status === "excluded";
    const others = (p.alsoIn || []).map((name) => {
      const o = cur().groups.find((x) => x.name === name);
      return o ? `<a data-open="${o.id}">${esc(name)}</a>` : esc(name);
    }).join(", ");

    return `<tr>
      <td class="mono url">${esc(p.url)}</td>
      <td>${stPill(p)}</td>
      <td class="small muted">${isEx ? "" : timeAgo(p.scannedAt)}</td>
      <td class="small">${others}</td>
      <td class="actions">
        ${isEx ? `<button class="btn small" data-include="${esc(p.url)}">Include again</button>` : `
          <button class="btn small" data-rescanpage="${esc(p.url)}" ${p.status === "capturing" ? "disabled" : ""}>Rescan</button>
          <button class="btn small danger" data-remove="${esc(p.url)}">${sitemap ? "Exclude" : "Remove"}</button>
        `}
      </td>
    </tr>`;
  }).join("");

  const f = (k, label, count) => `<button class="fbtn${S.status === k ? " on" : ""}" data-status="${k}">${label} ${fmt(count)}</button>`;

  const pos = document.activeElement && document.activeElement.id === "search" ? document.activeElement.selectionStart : null;

  $("#view").innerHTML = `
    <a class="back" data-open="list">← All groups on ${esc(cur().name)}</a>
    <div class="ghead">
      <h1>${esc(g.name)}</h1>
      <label class="switch" title="${g.active ? "Pause" : "Activate"}"><input type="checkbox" data-toggle="${g.id}" ${g.active ? "checked" : ""}><span></span></label>
      <span class="muted small">${g.active ? "Active" : "Paused"}</span>
      <span class="sp"></span>
      <button class="btn" data-rescan="${g.id}" ${g.job ? "disabled" : ""}>Rescan group</button>
      <button class="btn danger" data-del="${g.id}">Delete group</button>
    </div>
    <p style="margin:-6px 0 14px">${sourceText(g)}${sitemap ? ` <span class="muted small">· read again on every rescan</span>` : ""} · ${statusCell(g)}</p>
    <div class="card">
      <div class="card-h">
        <div class="filters">
          ${f("all", "All", c.all)}
          ${f("ok", "OK", c.ok)}
          ${f("failed", "Failed", c.failed)}
          ${f("new", "Not scanned yet", c.new)}
          ${sitemap || c.excluded ? f("excluded", "Excluded", c.excluded) : ""}
        </div>
        <span class="sp"></span>
        <input type="text" id="search" placeholder="Filter by URL" value="${esc(S.search)}" style="width:220px">
        ${sitemap ? "" : `<button class="btn primary" id="openAddPages">+ Add pages</button>`}
      </div>
      ${data.pages && data.pages.length ? `
        <table>
          <thead><tr><th>Page</th><th>Status</th><th>Scanned</th><th>Also in</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>` : `<p class="muted" style="padding:16px;margin:0">No pages match the filter.</p>`}
      ${data.total > data.pages.length ? `
        <div style="padding:10px 16px;border-top:1px solid var(--line-soft)">
          <button class="btn small" id="more">Show more (${fmt(data.pages.length)} of ${fmt(data.total)})</button>
        </div>` : ""}
    </div>`;

  if (pos != null) {
    const i = $("#search");
    if (i) { i.focus(); i.setSelectionRange(pos, pos); }
  }
}

// ---------------------------------------------------------------- modal handling
function openModal(mode) {
  S.modalMode = mode;
  S.pending = null;
  $("#modalErr").classList.add("hidden");
  $("#modalErr").textContent = "";
  $("#gName").value = "";
  $("#smFilter").value = "";
  $("#pasteBox").value = "";
  $("#csvFile").value = "";
  $("#captureNow").checked = true;

  const currentG = G(S.view);
  const isGroup = mode === "group";
  $("#mTitle").textContent = isGroup ? "Add a page group" : `Add pages to ${currentG ? currentG.name : ""}`;
  $("#mOk").textContent = isGroup ? "Add group" : "Add pages";
  $("#gNameWrap").classList.toggle("hidden", !isGroup);
  $('[data-src="sitemap"]').classList.toggle("hidden", !isGroup);

  const siteUrl = cur().site?.siteUrl;
  if (siteUrl) {
    $("#smUrl").value = siteUrl.replace(/\/$/, "") + "/sitemap.xml";
  } else {
    $("#smUrl").value = "sitemap.xml"; // read from inside the site folder
  }

  setSrc(isGroup ? "sitemap" : "paste");
  $("#modal").classList.add("open");
  (isGroup ? $("#gName") : $("#pasteBox")).focus();
}

function closeModal() {
  $("#modal").classList.remove("open");
  $("#modalErr").classList.add("hidden");
  $("#modalErr").textContent = "";
}

function setSrc(src) {
  S.src = src;
  S.pending = null;
  document.querySelectorAll("#srcTabs button").forEach((b) => b.classList.toggle("on", b.dataset.src === src));
  document.querySelectorAll("[data-pane]").forEach((p) => p.classList.toggle("hidden", p.dataset.pane !== src));
  showPreview();
}

function showPreview(html) {
  const p = $("#srcPreview");
  p.classList.toggle("hidden", !html);
  p.innerHTML = html || "";
  updateOk();
}

function updateOk() {
  const isGroup = S.modalMode === "group";
  const hasName = !isGroup || $("#gName").value.trim().length > 0;
  const hasPending = S.pending && (S.pending.urls ? S.pending.urls.length > 0 : true);
  $("#mOk").disabled = !(hasName && hasPending);
}

function setPending(urls, source, extra = "") {
  S.pending = { urls, source };
  const count = urls.length;
  const secs = Math.max(5, Math.round(count * 0.12));
  showPreview(`<b>${plural(count, "page")}</b>${extra} · scanning takes about ${secs < 90 ? secs + " s" : Math.round(secs / 60) + " min"}<ul>${urls.slice(0, 4).map((u) => `<li class="mono">${esc(u)}</li>`).join("")}${count > 4 ? `<li>… and ${fmt(count - 4)} more</li>` : ""}</ul>`);
}

function parseCsv(text, file) {
  const lines = text.split(/\r?\n/).filter((l) => l.trim().length > 0);
  if (!lines.length) {
    showPreview(`CSV file <b>${esc(file)}</b> is empty.`);
    return;
  }

  // Parse CSV rows taking care of quotes
  const rows = lines.map((line) => {
    const cells = [];
    let cur = "", inQuotes = false;
    for (let i = 0; i < line.length; i++) {
      const c = line[i];
      if (c === '"') {
        if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
        else inQuotes = !inQuotes;
      } else if (c === ',' && !inQuotes) {
        cells.push(cur.trim());
        cur = "";
      } else {
        cur += c;
      }
    }
    cells.push(cur.trim());
    return cells;
  });

  const width = Math.max(...rows.map((r) => r.length));
  let bestCol = 0, bestCount = -1;
  const headers = rows[0].map((h) => h.toLowerCase());

  // First try header names: url, link, path, address, page
  const targetCols = ["url", "link", "path", "address", "page"];
  for (let i = 0; i < headers.length; i++) {
    if (targetCols.includes(headers[i])) {
      bestCol = i;
      bestCount = 999999;
      break;
    }
  }

  if (bestCount < 0) {
    for (let i = 0; i < width; i++) {
      const count = rows.filter((r) => isUrl(r[i])).length;
      if (count > bestCount) { bestCount = count; bestCol = i; }
    }
  }

  const origin = cur().site?.siteUrl ? new URL(cur().site.siteUrl).origin : "";
  const rawVals = rows.map((r) => r[bestCol]).filter(Boolean);
  const byHeader = bestCount === 999999;
  const urls = [...new Set(rawVals.slice(byHeader ? 1 : 0).filter((v) => isUrl(v) || (byHeader && isBarePath(v))).map((v) => toPagePath(v, origin)))];

  if (!urls.length) {
    S.pending = null;
    showPreview(`No column of URLs or paths found in <b>${esc(file)}</b>.`);
    return;
  }

  const head = rows[0][bestCol];
  if (S.modalMode === "group" && !$("#gName").value) {
    $("#gName").value = file.replace(/\.csv$/i, "").replace(/[-_]/g, " ");
  }

  setPending(urls, { type: "csv", file }, ` from column <b>${esc(isUrl(head) ? `#${bestCol + 1}` : head)}</b> of ${esc(file)}`);
}

function parsePasted(text) {
  const origin = cur().site?.siteUrl ? new URL(cur().site.siteUrl).origin : "";
  const tokens = text.split(/[\r\n]+/).map((t) => t.trim()).filter(Boolean);
  const urls = [...new Set(tokens.filter((v) => isUrl(v) || isBarePath(v)).map((v) => toPagePath(v, origin)))];

  if (urls.length) {
    setPending(urls, { type: "paste" });
  } else {
    S.pending = null;
    showPreview();
  }
}

// ---------------------------------------------------------------- toast
let toastTimer;
function toast(html, action, fn, isError = false) {
  const t = $("#toast");
  t.classList.toggle("err", !!isError);
  $("#toastText").innerHTML = html;
  $("#toastAct").innerHTML = action ? `<button class="btn small">${esc(action)}</button>` : "";
  if (action && fn) {
    $("#toastAct button").onclick = (e) => {
      e.stopPropagation();
      fn();
      t.classList.remove("show");
    };
  }
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 6000);
}

// ---------------------------------------------------------------- event listeners
document.addEventListener("click", async (e) => {
  const chip = e.target.closest(".chip[data-dev]");
  if (chip) {
    chip.classList.toggle("on");
    return;
  }

  const t = e.target.closest("button, a[data-open], a[data-nav], a[data-site]");
  if (!t) return;
  const d = t.dataset;
  const sid = S.site;

  if (d.nav) {
    go(d.nav === "new" ? "new" : null);
  }
  else if (d.site) {
    go(d.site, d.group || "list");
  }
  else if (d.open) {
    go(sid, d.open);
  }
  else if (t.id === "delSite") {
    const site = siteById(sid);
    if (!site) return;
    if (!confirm(`Delete ${site.name}?\n\nThis removes its ${plural((site.groups || []).length, "page group")} and its scan (${fmt(site.totals?.pages)} pages) from this computer.`)) return;
    try {
      await api(sp("", sid), { method: "DELETE" });
      go(null);
      await loadState();
      toast(`Deleted <b>${esc(site.name)}</b>.`);
    } catch (err) {
      toast(err.message, null, null, true);
    }
  }
  else if (t.id === "watchCheck") {
    t.disabled = true;
    t.textContent = "Checking…";
    try { applyState(await api(sp("/watch/check", sid), { method: "POST" })); } catch (err) { toast(err.message, null, null, true); }
  }
  else if (t.id === "watchRepoEdit") {
    S.watchRepoEditing = true;
    S.watchRepoDraft = undefined;
    render();
  }
  else if (t.id === "watchRepoCancel") {
    S.watchRepoEditing = false;
    S.watchRepoDraft = undefined;
    render();
  }
  else if (t.id === "watchRepoSave") {
    const repo = ($("#watchRepoInput")?.value || "").trim();
    try {
      const s = await api(sp("/watch", sid), { method: "PUT", body: JSON.stringify({ repo }) });
      S.watchRepoEditing = false;
      S.watchRepoDraft = undefined;
      applyState(s);
      toast(repo ? "Repository folder saved. Checking it shortly." : "The server will look for the repository among your VS Code projects.");
    } catch (err) {
      toast(err.message, null, null, true);
    }
  }
  else if (t.id === "editSite") {
    S.siteEditing = true;
    render();
  }
  else if (t.id === "cancelSite") {
    S.siteEditing = false;
    render();
  }
  else if (t.id === "welcomeSave" || t.id === "saveSite") {
    const isWelcome = t.id === "welcomeSave";
    const input = $(isWelcome ? "#welcomeAddr" : "#siteAddrInput");
    const container = $(isWelcome ? "#welcomeDevs" : "#siteDevChips");
    const addr = input.value.trim();
    if (!addr) {
      alert("Please enter a site address or folder path.");
      input.focus();
      return;
    }
    const devs = [...container.querySelectorAll(".chip.on")].map((c) => c.dataset.dev);
    if (!devs.length) {
      alert("Please select at least one device.");
      return;
    }

    const isHttp = /^https?:\/\//i.test(addr);
    const body = {
      siteUrl: isHttp ? addr : "",
      siteFolder: isHttp ? "" : addr,
      devices: devs
    };

    if (isWelcome) {
      try {
        const res = await api("/api/sites", { method: "POST", body: JSON.stringify(body) });
        applyState(res.state || await api("/api/state"));
        // Replace "#new" so Back goes to the list of sites, not to the empty form.
        history.replaceState(null, "", "#" + new URLSearchParams({ site: res.id }).toString());
        route();
        toast("Site added. Add a page group to start scanning it.");
      } catch (err) {
        toast(err.message, null, null, true);
      }
      return;
    }

    try {
      const res = await api(sp("", sid), { method: "PUT", body: JSON.stringify(body) });
      S.siteEditing = false;
      applyState(res.state || state);
      if (res.needsRescan) {
        toast("Site settings saved. The active groups need a rescan.", "Rescan all", async () => {
          try { await api(sp("/rescan-all", sid), { method: "POST" }); } catch (err) { toast(err.message, null, null, true); }
        });
      } else {
        toast("Site settings saved.");
      }
    } catch (err) {
      toast(err.message, null, null, true);
    }
  }
  else if (t.id === "openAdd") {
    openModal("group");
  }
  else if (t.id === "openAddPages") {
    openModal("pages");
  }
  else if (t.hasAttribute("data-close")) {
    closeModal();
  }
  else if (d.src) {
    setSrc(d.src);
  }
  else if (t.id === "smPreview") {
    const smUrl = $("#smUrl").value.trim();
    if (!smUrl) return;
    const filter = $("#smFilter").value.trim();
    showPreview(`<span class="spinner"></span> Reading ${esc(smUrl)}…`);
    try {
      const res = await api(sp("/sitemap/preview", sid), {
        method: "POST",
        body: JSON.stringify({ url: smUrl, filter: filter || undefined })
      });
      const urls = res.urls || [];
      const total = res.total || urls.length;
      if (!urls.length) {
        S.pending = null;
        showPreview(`No page in the sitemap matches <span class="mono">${esc(filter || "*")}</span>.`);
        return;
      }
      setPending(urls, { type: "sitemap", url: smUrl, filter: filter || undefined }, filter ? ` match <span class="mono">${esc(filter)}</span> (of ${fmt(total)} in the sitemap)` : ` (of ${fmt(total)} in the sitemap)`);
    } catch (err) {
      S.pending = null;
      showPreview(`<span class="reason">Failed to read sitemap: ${esc(err.message)}</span>`);
    }
  }
  else if (t.id === "mOk") {
    const isGroup = S.modalMode === "group";
    const scan = $("#captureNow").checked;
    const errBox = $("#modalErr");
    errBox.classList.add("hidden");

    try {
      if (isGroup) {
        const name = $("#gName").value.trim();
        const payload = {
          name,
          source: S.pending.source,
          urls: S.pending.source.type === "sitemap" ? undefined : S.pending.urls,
          scan
        };
        const res = await api(sp("/groups", sid), { method: "POST", body: JSON.stringify(payload) });
        closeModal();
        toast(`Added <b>${esc(res.name || name)}</b> with ${plural(res.pages || S.pending.urls?.length || 0, "page")}.`);
        await loadState();
      } else {
        const gid = S.view;
        const g = G(gid);
        const res = await api(sp(`/groups/${gid}/pages`, sid), { method: "POST", body: JSON.stringify({ urls: S.pending.urls, scan }) });
        closeModal();
        toast(`Added ${plural(res.added, "page")} to <b>${esc(g ? g.name : "")}</b>${res.already ? ` (${fmt(res.already)} were already in it)` : ""}.`);
        fetchPages(gid);
      }
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.remove("hidden");
    }
  }
  else if (d.rescan) {
    const gid = d.rescan;
    try {
      await api(sp(`/groups/${gid}/rescan`, sid), { method: "POST" });
      toast(`Rescan queued for <b>${esc(G(gid)?.name || "group")}</b>.`);
      await loadState();
    } catch (err) {
      toast(err.message, null, null, true);
    }
  }
  else if (d.del) {
    const gid = d.del;
    const g = G(gid);
    try {
      await api(sp(`/groups/${gid}`, sid), { method: "DELETE" });
      if (S.view === gid) S.view = "list";
      await loadState();
      toast(`Deleted <b>${esc(g?.name || "group")}</b>.`, "Undo", async () => {
        try {
          await api(sp(`/groups/${gid}/restore`, sid), { method: "POST" });
          await loadState();
        } catch (err) {
          toast(err.message, null, null, true);
        }
      });
    } catch (err) {
      toast(err.message, null, null, true);
    }
  }
  else if (d.status) {
    S.status = d.status;
    S.limit = 50;
    fetchPages(S.view);
  }
  else if (t.id === "more") {
    S.limit += 50;
    fetchPages(S.view);
  }
  else if (d.rescanpage) {
    const url = d.rescanpage;
    try {
      await api(sp("/rescan", sid), { method: "POST", body: JSON.stringify({ urls: [url] }) });
      toast(`Rescan queued for <span class="mono">${esc(url)}</span>.`);
    } catch (err) {
      toast(err.message, null, null, true);
    }
  }
  else if (d.remove) {
    const url = d.remove;
    const gid = S.view;
    const g = G(gid);
    try {
      const res = await api(sp(`/groups/${gid}/remove`, sid), { method: "POST", body: JSON.stringify({ url }) });
      fetchPages(gid);
      if (res.excluded) {
        toast(`Excluded <span class="mono">${esc(url)}</span>. It stays out even though the sitemap lists it.`, "Undo", async () => {
          try {
            await api(sp(`/groups/${gid}/include`, sid), { method: "POST", body: JSON.stringify({ url }) });
            fetchPages(gid);
          } catch (err) {
            toast(err.message, null, null, true);
          }
        });
      } else {
        toast(`Removed <span class="mono">${esc(url)}</span> from <b>${esc(g?.name || "")}</b>.`, "Undo", async () => {
          try {
            await api(sp(`/groups/${gid}/pages`, sid), { method: "POST", body: JSON.stringify({ urls: [url], scan: false }) });
            fetchPages(gid);
          } catch (err) {
            toast(err.message, null, null, true);
          }
        });
      }
    } catch (err) {
      toast(err.message, null, null, true);
    }
  }
  else if (d.include) {
    const url = d.include;
    const gid = S.view;
    try {
      await api(sp(`/groups/${gid}/include`, sid), { method: "POST", body: JSON.stringify({ url }) });
      fetchPages(gid);
    } catch (err) {
      toast(err.message, null, null, true);
    }
  }
});

document.addEventListener("change", async (e) => {
  const t = e.target;
  const sid = S.site;
  if (t.id === "watchToggle" || t.id === "watchInterval" || t.id === "watchNewPages") {
    const body = t.id === "watchToggle" ? { enabled: t.checked } : t.id === "watchNewPages" ? { newPages: t.checked } : { intervalSec: Number(t.value) };
    try { applyState(await api(sp("/watch", sid), { method: "PUT", body: JSON.stringify(body) })); } catch (err) { toast(err.message, null, null, true); }
    return;
  }
  if (t.dataset.toggle) {
    const gid = t.dataset.toggle;
    const active = t.checked;
    const g = G(gid);
    try {
      await api(sp(`/groups/${gid}`, sid), { method: "PATCH", body: JSON.stringify({ active }) });
      if (!active) {
        toast(`<b>${esc(g?.name || "")}</b> paused. It won't be rescanned or counted; its copy from ${timeAgo(g?.scannedAt)} is kept.`);
      } else {
        toast(`<b>${esc(g?.name || "")}</b> is active again, using its copy from ${timeAgo(g?.scannedAt)}.`, "Rescan now", async () => {
          try { await api(sp(`/groups/${gid}/rescan`, sid), { method: "POST" }); } catch (err) { toast(err.message, null, null, true); }
        });
      }
      await loadState();
    } catch (err) {
      t.checked = !active;
      toast(err.message, null, null, true);
    }
  }
  else if (t.id === "csvFile" && t.files[0]) {
    const f = t.files[0];
    f.text().then((txt) => parseCsv(txt, f.name));
  }
});

let searchDebounce;
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "search") {
    S.search = t.value.trim();
    S.limit = 50;
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => fetchPages(S.view), 250);
  }
  else if (t.id === "gName") {
    updateOk();
  }
  else if (t.id === "pasteBox") {
    parsePasted(t.value);
  }
});

const drop = $("#drop");
if (drop) {
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => {
    e.preventDefault();
    drop.classList.remove("over");
    const f = e.dataTransfer.files[0];
    if (f) f.text().then((txt) => parseCsv(txt, f.name));
  });
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});

// Initial boot
({ site: S.site, group: S.view } = readHash());
loadState();
connectEvents();
</script>
</body>
</html>
